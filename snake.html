<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="纯 HTML/CSS/JS 实现的贪吃蛇小游戏，支持键盘与触屏操作">
<title>贪吃蛇 · Snake Game</title>
<style>
  :root {
    --bg: #f2f5f9;
    --card: #ffffff;
    --line: #e3e8ef;
    --text: #1f2937;
    --muted: #6b7280;
    --accent: #16a34a;
    --accent-soft: #dcfce7;
    --danger: #ef4444;
    --shadow: 0 10px 30px rgba(15, 23, 42, .08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 14px;
  }

  .wrap {
    width: 100%;
    max-width: 520px;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: .5px;
  }

  h1 span { color: var(--accent); }

  .sub { font-size: 12px; color: var(--muted); }

  /* ---------- 数据面板 ---------- */
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 6px;
    text-align: center;
    box-shadow: var(--shadow);
  }

  .stat .k {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .stat .v {
    font-size: 18px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 棋盘 ---------- */
  .stage {
    position: relative;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 10px;
    box-shadow: var(--shadow);
  }

  canvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    background: #fbfcfe;
    touch-action: none; /* 防止移动端滑动页面 */
  }

  .overlay {
    position: absolute;
    inset: 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;
  }

  .overlay[hidden] { display: none; }

  .overlay h2 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.7; }

  .btn {
    margin-top: 4px;
    border: 0;
    cursor: pointer;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: translateY(1px); }
  .btn:focus-visible { outline: 3px solid #86efac; outline-offset: 2px; }

  /* ---------- 控制区 ---------- */
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 12px;
  }

  .ghost {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .ghost:hover { border-color: #cbd5e1; }
  .ghost:focus-visible { outline: 3px solid #bfdbfe; outline-offset: 2px; }

  /* 移动端方向键 */
  .dpad {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    justify-content: center;
    align-items: center;
    gap: 6px;
    margin: 14px auto 0;
  }
  .dpad button {
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 12px;
    font-size: 18px;
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
  }
  .dpad button:active { background: var(--accent-soft); }
  .dpad .up    { grid-area: 1 / 2; }
  .dpad .left  { grid-area: 2 / 1; }
  .dpad .right { grid-area: 2 / 3; }
  .dpad .down  { grid-area: 3 / 2; }

  .tips {
    margin: 14px 2px 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.8;
  }
  .tips kbd {
    background: #fff;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: inherit;
  }

  /* 窄屏时显示虚拟方向键 */
  @media (max-width: 560px), (pointer: coarse) {
    .dpad { display: grid; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>🐍 <span>贪吃蛇</span></h1>
    <div class="sub">Snake · 纯前端实现</div>
  </header>

  <div class="stats">
    <div class="stat"><span class="k">得分</span><span class="v" id="score">0</span></div>
    <div class="stat"><span class="k">最高分</span><span class="v" id="best">0</span></div>
    <div class="stat"><span class="k">长度</span><span class="v" id="len">3</span></div>
    <div class="stat"><span class="k">等级</span><span class="v" id="level">1</span></div>
  </div>

  <div class="stage">
    <canvas id="board" role="img" aria-label="贪吃蛇游戏棋盘，使用方向键控制蛇的方向"></canvas>

    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备好了吗？</h2>
      <p id="ovText">用方向键 / WASD 控制小蛇吃到食物。<br>撞墙或撞到自己就结束啦。</p>
      <button class="btn" id="ovBtn" type="button">开始游戏</button>
    </div>
  </div>

  <div class="bar">
    <button class="ghost" id="btnPause" type="button">暂停</button>
    <button class="ghost" id="btnSound" type="button" aria-pressed="true">🔊 音效</button>
    <button class="ghost" id="btnRestart" type="button">重新开始</button>
  </div>

  <div class="dpad" aria-hidden="false">
    <button class="up"    type="button" data-dir="up"    aria-label="向上">↑</button>
    <button class="left"  type="button" data-dir="left"  aria-label="向左">←</button>
    <button class="right" type="button" data-dir="right" aria-label="向右">→</button>
    <button class="down"  type="button" data-dir="down"  aria-label="向下">↓</button>
  </div>

  <p class="tips">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向 ·
    <kbd>空格</kbd> 暂停/继续 · <kbd>R</kbd> 重开 · 手机可直接滑动屏幕
  </p>
</div>

<script>
(function () {
  'use strict';

  /* ========== 常量与画布 ========== */
  const COLS = 20, ROWS = 20, CELL = 24;          // 逻辑尺寸 480 x 480
  const W = COLS * CELL, H = ROWS * CELL;

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);                            // 之后都按逻辑像素绘制

  /* ========== DOM ========== */
  const el = {
    score: document.getElementById('score'),
    best: document.getElementById('best'),
    len: document.getElementById('len'),
    level: document.getElementById('level'),
    overlay: document.getElementById('overlay'),
    ovTitle: document.getElementById('ovTitle'),
    ovText: document.getElementById('ovText'),
    ovBtn: document.getElementById('ovBtn'),
    btnPause: document.getElementById('btnPause'),
    btnRestart: document.getElementById('btnRestart'),
    btnSound: document.getElementById('btnSound')
  };

  /* ========== 状态 ========== */
  let snake, prevSnake, dir, queue, food;
  let score, best, alive, started, paused;
  let lastStep, stepInterval, foodTime;

  best = Number(localStorage.getItem('snake_best') || 0);

  const DIRS = {
    up:    { x: 0,  y: -1 },
    down:  { x: 0,  y: 1  },
    left:  { x: -1, y: 0  },
    right: { x: 1,  y: 0  }
  };

  function levelOf(s) { return Math.floor(s / 50) + 1; }
  function speedOf(s) { return Math.max(70, 160 - (levelOf(s) - 1) * 9); }

  /* ========== 初始化 ========== */
  function reset() {
    const cx = Math.floor(COLS / 2), cy = Math.floor(ROWS / 2);
    snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
    prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
    dir = DIRS.right;
    queue = [];
    score = 0;
    alive = true;
    paused = false;
    stepInterval = speedOf(0);
    foodTime = 0;
    placeFood();
    syncHUD();
  }

  // 随机放置食物，确保不与蛇身重叠
  function placeFood() {
    const taken = new Set(snake.map(s => s.x + ',' + s.y));
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!taken.has(x + ',' + y)) free.push({ x: x, y: y });
      }
    }
    if (free.length === 0) { food = null; return; } // 铺满棋盘 —— 通关
    food = free[Math.floor(Math.random() * free.length)];
  }

  function syncHUD() {
    el.score.textContent = score;
    el.best.textContent = best;
    el.len.textContent = snake.length;
    el.level.textContent = levelOf(score);
    el.btnPause.textContent = paused ? '继续' : '暂停';
  }

  /* ========== 控制 ========== */
  function turn(name) {
    const d = DIRS[name];
    if (!d || !alive) return;
    if (!started) start();
    // 与「最后一个待执行方向」比较，避免同帧连按两次导致自杀
    const lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (d.x === -lastDir.x && d.y === -lastDir.y) return; // 禁止 180° 掉头
    if (d.x === lastDir.x && d.y === lastDir.y) return;   // 忽略重复方向
    if (queue.length < 2) queue.push(d);
  }

  function step() {
    if (queue.length) dir = queue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return die();

    const willGrow = food && head.x === food.x && head.y === food.y;
    const body = willGrow ? snake : snake.slice(0, -1);   // 不吃食物时尾巴会让位

    // 撞自己
    for (let i = 0; i < body.length; i++) {
      if (body[i].x === head.x && body[i].y === head.y) return die();
    }

    snake.unshift(head);

    if (willGrow) {
      score += 10;
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', String(best));
      }
      stepInterval = speedOf(score);
      foodTime = performance.now();
      beep(660, 0.07);
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
    syncHUD();
  }

  function die() {
    alive = false;
    started = false;
    beep(160, 0.18);
    el.ovTitle.textContent = '游戏结束';
    el.ovText.innerHTML = '本局得分 <b>' + score + '</b> · 最高分 <b>' + best + '</b><br>蛇身长度 ' + snake.length;
    el.ovBtn.textContent = '再来一局';
    el.overlay.hidden = false;
    el.btnPause.textContent = '暂停';
  }

  function win() {
    alive = false;
    started = false;
    el.ovTitle.textContent = '🎉 通关啦！';
    el.ovText.innerHTML = '你把整个棋盘都填满了，得分 <b>' + score + '</b>';
    el.ovBtn.textContent = '再玩一次';
    el.overlay.hidden = false;
  }

  function start() {
    if (!alive) { reset(); }
    started = true;
    paused = false;
    lastStep = performance.now();
    el.overlay.hidden = true;
    syncHUD();
  }

  function togglePause() {
    if (!started) return;
    paused = !paused;
    if (!paused) lastStep = performance.now(); // 避免恢复瞬间连续走多格
    syncHUD();
  }

  /* ========== 音效（WebAudio，无外部资源） ========== */
  let soundOn = true;
  let ac = null;
  function beep(freq, dur) {
    if (!soundOn) return;
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.08, ac.currentTime + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      o.connect(g).connect(ac.destination);
      o.start();
      o.stop(ac.currentTime + dur + 0.02);
    } catch (e) { /* 静默失败，不影响游戏 */ }
  }

  /* ========== 绘制 ========== */
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawBoard() {
    ctx.fillStyle = '#fbfcfe';
    ctx.fillRect(0, 0, W, H);
    // 细网格
    ctx.fillStyle = '#f1f5f9';
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 1) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
  }

  function drawFood(now) {
    if (!food) return;
    const pulse = 1 + Math.sin(now / 220) * 0.08;
    const cx = food.x * CELL + CELL / 2;
    const cy = food.y * CELL + CELL / 2;
    const r = (CELL / 2 - 3) * pulse;

    ctx.save();
    ctx.shadowColor = 'rgba(239, 68, 68, .45)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.3, cy - r * 0.3, r * 0.22, 0, Math.PI * 2);
    ctx.fill();
  }

  // 在 prev -> cur 之间插值，得到平滑的移动动画
  function lerpSnake(t) {
    return snake.map(function (s, i) {
      const p = (i === 0 ? prevSnake[0] : prevSnake[i - 1]) || s;
      return {
        x: (p.x + (s.x - p.x) * t) * CELL,
        y: (p.y + (s.y - p.y) * t) * CELL
      };
    });
  }

  function drawSnake(t) {
    const pts = lerpSnake(t);
    const n = pts.length;

    // 从尾到头绘制，保证头部在最上层
    for (let i = n - 1; i >= 0; i--) {
      const p = pts[i];
      const ratio = n > 1 ? i / (n - 1) : 0;
      // 头部亮绿 → 尾部浅绿
      const g = 190 - ratio * 40;
      const inset = 1.5 + ratio * 1.2;
      ctx.fillStyle = 'rgb(' + Math.round(34 - ratio * 12) + ',' + g + ',' + Math.round(84 + ratio * 40) + ')';
      roundRect(p.x + inset, p.y + inset, CELL - inset * 2, CELL - inset * 2, 6);
      ctx.fill();
    }

    // 连接相邻方块，消除缝隙
    ctx.fillStyle = '#22c55e';
    for (let i = 0; i < n - 1; i++) {
      const a = pts[i], b = pts[i + 1];
      const x = Math.min(a.x, b.x) + 4, y = Math.min(a.y, b.y) + 4;
      const w = Math.abs(a.x - b.x) + CELL - 8, h = Math.abs(a.y - b.y) + CELL - 8;
      ctx.fillRect(x, y, w, h);
    }

    // 头部眼睛
    const h = pts[0];
    const cx = h.x + CELL / 2, cy = h.y + CELL / 2;
    const off = 5, r = 2.6;
    const ex = dir.x * 3, ey = dir.y * 3;
    const px = -dir.y, py = dir.x; // 垂直于前进方向
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(cx + ex + px * off, cy + ey + py * off, r, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + ex - px * off, cy + ey - py * off, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#0f172a';
    ctx.beginPath(); ctx.arc(cx + ex + px * off, cy + ey + py * off, r * 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + ex - px * off, cy + ey - py * off, r * 0.5, 0, Math.PI * 2); ctx.fill();
  }

  /* ========== 主循环 ========== */
  function loop(now) {
    requestAnimationFrame(loop);

    const running = started && !paused && alive;

    if (running) {
      if (now - lastStep >= stepInterval) {
        prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
        step();
        lastStep = now;
      }
    }

    const t = running ? Math.min(1, (now - lastStep) / stepInterval) : 1;
    drawBoard();
    drawFood(now);
    drawSnake(t);
  }

  /* ========== 事件绑定 ========== */
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right',
    W: 'up', S: 'down', A: 'left', D: 'right'
  };

  window.addEventListener('keydown', function (e) {
    const name = KEYMAP[e.key];
    if (name) {
      e.preventDefault();               // 阻止方向键滚动页面
      turn(name);
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!started && alive) start();
      else if (!alive) { reset(); start(); }
      else togglePause();
    } else if (e.key === 'r' || e.key === 'R') {
      reset(); start();
    } else if (e.key === 'Enter' && !started) {
      if (!alive) reset();
      start();
    }
  }, { passive: false });

  el.ovBtn.addEventListener('click', function () {
    if (!alive) reset();
    start();
    canvas.focus();
  });

  el.btnPause.addEventListener('click', togglePause);
  el.btnRestart.addEventListener('click', function () { reset(); start(); });
  el.btnSound.addEventListener('click', function () {
    soundOn = !soundOn;
    el.btnSound.textContent = soundOn ? '🔊 音效' : '🔇 静音';
    el.btnSound.setAttribute('aria-pressed', String(soundOn));
  });

  // 虚拟方向键
  document.querySelectorAll('.dpad button').forEach(function (b) {
    b.addEventListener('click', function () { turn(b.dataset.dir); });
  });

  // 触屏滑动
  let sx = 0, sy = 0, tracking = false;
  canvas.addEventListener('touchstart', function (e) {
    const t0 = e.touches[0];
    sx = t0.clientX; sy = t0.clientY; tracking = true;
  }, { passive: true });

  canvas.addEventListener('touchmove', function (e) {
    if (!tracking) return;
    e.preventDefault();
    const t0 = e.touches[0];
    const dx = t0.clientX - sx, dy = t0.clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    sx = t0.clientX; sy = t0.clientY;
  }, { passive: false });

  canvas.addEventListener('touchend', function () { tracking = false; }, { passive: true });

  // 切到后台自动暂停，避免回来时「瞬移」
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && started && !paused) togglePause();
  });

  /* ========== 启动 ========== */
  reset();
  started = false;                 // 初始停在「开始」界面
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
